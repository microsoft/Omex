name: PR Metrics

on:
  pull_request_target:
    branches:
      - main
      - release

permissions: {}

jobs:
  pr-metrics:
    name: PR Metrics
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
      - name: Checkout – Trusted Action
        uses: actions/checkout@v7
        with:
          path: trusted-action
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .github/actions
      - name: App Token – Mint
        id: app-token
        uses: ./trusted-action/.github/actions/mint-github-app-token
        with:
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          permissions: '{"pull_requests":"write"}'
      - name: PR Metrics
        uses: microsoft/PR-Metrics@v1.7.17
        env:
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
          GITHUB_REF: refs/pull/${{ github.event.pull_request.number }}/merge
          PR_METRICS_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
