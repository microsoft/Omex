name: Build and run unit tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - release
  release:
    types:
      - published

permissions: {}

jobs:
  pr-metrics:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    name: PR Metrics
    runs-on: windows-latest
    environment: github-app-main
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: App Token – Mint
        id: app-token
        uses: ./.github/actions/mint-github-app-token
        with:
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          permissions: '{"pull_requests":"write"}'
      - name: PR Metrics
        uses: microsoft/PR-Metrics@0959437740572519916a08b3609e67ffa435f8dd # v1.7.17
        env:
          PR_METRICS_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}

  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [windows-latest] # [ubuntu-latest, windows-latest, macOS-latest]
        configuration: [Release, Debug]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install SF SDK
        shell: powershell
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Unrestricted -Force -Scope CurrentUser
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -OutFile setup.exe -Uri https://download.microsoft.com/download/b/8/a/b8a2fb98-0ec1-41e5-be98-9d8b5abf7856/MicrosoftServiceFabric.11.6.239.1.exe
          .\setup.exe /accepteula /force /quiet /SkipPSExecutionPolicy
      - name: Restore NuGet packages
        run: dotnet restore --configfile NuGet-GitHub.Config
      - name: Build with dotnet
        run: dotnet build --configuration ${{ matrix.configuration }} --no-restore
      - name: Run Unit Tests
        run: dotnet test --no-build --configuration ${{ matrix.configuration }} --no-restore
      - name: Create NuGet packages
        run: dotnet pack --no-build --configuration ${{ matrix.configuration }} --no-restore

  publish:
    if: github.event_name == 'release' && !github.event.release.prerelease && github.event.release.target_commitish == 'main'
    name: Publish NuGet packages
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    env:
      IsReleaseBuild: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install SF SDK
        shell: powershell
        run: |
          Set-ExecutionPolicy -ExecutionPolicy Unrestricted -Force -Scope CurrentUser
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -OutFile setup.exe -Uri https://download.microsoft.com/download/b/8/a/b8a2fb98-0ec1-41e5-be98-9d8b5abf7856/MicrosoftServiceFabric.11.4.268.1.exe
          .\setup.exe /accepteula /force /quiet /SkipPSExecutionPolicy
      - name: Restore NuGet packages
        run: dotnet restore --configfile NuGet-GitHub.Config
      - name: Build with dotnet
        run: dotnet build --configuration Release --no-restore
      - name: Create NuGet packages
        run: dotnet pack --no-build --configuration Release --no-restore
      - name: Add GitHub package source
        run: dotnet nuget add source https://nuget.pkg.github.com/microsoft/index.json --name "github" --username NotUsed --password ${{ secrets.GITHUB_TOKEN }}
      - name: Publish NuGet packages
        run: dotnet nuget push nuget\*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source "github" --skip-duplicate --no-symbols true
