name: Package Updates (GitHub)

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions: {}

jobs:
  run-script-and-pr:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    environment: github-app-main
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout – Action
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - name: App Token – Mint
        id: app-token
        uses: ./.github/actions/mint-github-app-token
        with:
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          permissions: '{"contents":"write","issues":"write","pull_requests":"write"}'

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Update NuGet Packages
        shell: pwsh
        run: |
          ./.github/scripts/Update-NuGetPackageVersions.ps1 -Verbose -NugetConfigPath "NuGet-GitHub.Config"

      - name: Update .NET SDK
        shell: pwsh
        run: |
          ./.github/scripts/Update-DotNetSdkVersions.ps1 -Verbose -NugetConfigPath "NuGet-GitHub.Config" -SdkChannel "LTS"

      - name: Create branch, commit, push
        id: commit
        shell: pwsh
        run: |
          $branch = "automation/package-update-${{ github.run_id }}-${{ github.run_attempt }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $ChangedFilesCount = $(git status --porcelain | Measure-Object | Select-Object -expand Count)
          if ($ChangedFilesCount -eq 0) {
            Write-Host "No changes detected; skipping commit and PR creation."
            "has-changes=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }

          git checkout -b $branch
          git add -A

          git commit -m "chore(automation): update NuGet packages and .NET SDK versions"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "git commit failed with exit code $LASTEXITCODE."
            exit $LASTEXITCODE
          }

          git push --set-upstream origin $branch
          if ($LASTEXITCODE -ne 0) {
            Write-Error "git push failed with exit code $LASTEXITCODE."
            exit $LASTEXITCODE
          }
          "has-changes=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Open PR with gh
        if: steps.commit.outputs.has-changes == 'true' && steps.commit.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: pwsh
        run: |
          git fetch --no-tags --depth=2 origin main
          $commits = git log --oneline origin/main..HEAD
          if (-not $commits) {
            Write-Host "No commits between origin/main and HEAD; skipping PR creation."
            exit 0
          }
          gh pr create `
            --title "Automated Package Update - ${{ github.run_id }}" `
            --body "This PR was created automatically by the workflow run ${{ github.run_id }} (attempt ${{ github.run_attempt }})." `
            --base main `
            --head "automation/package-update-${{ github.run_id }}-${{ github.run_attempt }}" `
            --label automation `
            --assignee "${{ github.actor }}"
